    - "Any future Penpot workspace URL or token is never written into this repository."
    - "Gate 2 reports the blocker exactly; it never prints a connection URL or claims a Penpot capability that was not exercised."
    - "MCP connectivity alone is not proof that a write succeeded; every consequential operation is verified by reading the resulting state back (approved §8.5 — Reliability and auditability)."

# ---------------------------------------------------------------------------
# Direction of authority
# ---------------------------------------------------------------------------
direction: >-
  Founder decision → canonical token data (DESIGN_TOKENS.yaml) → Penpot variables
  → frontend CSS custom properties. Nothing flows upstream.

mapping_rules:
  tokens:
    - "Every Penpot variable name equals the canonical token name (<layer>.<domain>.<role>)."
    - "Penpot never originates a value that is absent from the canonical token data."
    - "A variable is modelled only once its decision is APPROVED (VALID_APPROVED); pending tokens are not modelled."
    - "Renaming a token requires a canonical rename first; Penpot follows."
  components:
    - "Every implemented P0/P1 component maps to exactly one stable manifest ID (COMP-*)."
    - "Every Penpot component records its manifest ID, layer (L1/L2), and token list from COMPONENT_DEPENDENCIES.yaml."
    - "Every L2 component has its Penpot counterpart (PEN-004 / rule R5) before implementation is declared done."
    - "L3 patterns are composed in Penpot from their L2 parts — never drawn as opaque wholes (rule R3)."
  pages:
    - "Every Penpot frame maps to a PAGE id and its template from PAGE_TEMPLATE_MAP.yaml."
    - "Frames for OUT_OF_SCOPE pages are not created (§25)."
    - "A page/frame reference is evidence only after verification in the configured remote Penpot workspace."
  verification:
    - "Visual parity is verified against the frontend implementation; Penpot existence alone is not completion."
    - "The Penpot map's components/pages/tokens blocks gain entries only with verification evidence attached."

rules:
  - "Every implemented P0/P1 component maps to exactly one stable manifest ID."
  - "Every Penpot variable name matches the canonical token naming scheme."
  - "Penpot never originates a value that is absent from the canonical token data."
  - "A page/frame reference is evidence only after it is verified in the configured remote Penpot workspace."
  - "Visual parity is verified against the frontend implementation; Penpot existence alone is not completion."

components: {}
pages: {}
tokens: {}
