# DECISION → MANIFEST EFFECTS MAP
#
# Machine-readable companion to DESIGN_DECISIONS.md §3 and DESIGN_MANIFEST.yaml.
# For every APPROVED decision, the §3 "Affected manifest IDs" line is the source of
# truth for which manifest items the decision touches. An item that still carries
# status FUTURE or OUT_OF_SCOPE while its governing decision is APPROVED is a
# policy violation UNLESS this file declares it an authorized deferral/exclusion.
#
#   deferred:   item stays FUTURE by explicit design of the cited decision.
#   excluded:   item is OUT_OF_SCOPE by explicit design of the cited decision.
#
# Editing rule: a deferral/exclusion may only be added here by an explicit founder
# decision; removing an entry happens by promoting the item in DESIGN_MANIFEST.yaml,
# never by silently deleting the entry here (audit trail preserved via git).
# tools/validate_decision_manifest.py enforces both directions and fails closed.
#
# The dark-theme (26.4) and motion (26.7) drift was resolved by promotion BEFORE
# this guard existed; it now prevents recurrence (evidence/runs/design-gate2-manifest-reconciliation-2026-10-11.md).
version: 1
