version: 1
description: >-
  Deterministic rendered-output checks for implemented pages (the "browser
  lane"), consumed by tools/browser_verify.py. Only pages whose status is
  CURRENT are executed. The lane proves rendered implementation ↔ design
  contract parity for the automated criteria; it never claims manual
  (keyboard-only / screen-reader / zoom) review, which stays human.

# url is relative to the repository root and resolved to a file:// URI, so the
# lane needs no web server and no network.
pages:
  - id: PAGE-001
    name: Landing
    status: CURRENT
    url: business/site/index.html
    title_prefix: "Company OS"

