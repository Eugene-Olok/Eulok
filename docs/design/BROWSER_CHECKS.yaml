viewports: [320, 480, 768, 1024, 1440]

# severity: fail → lane STATUS FAIL; warn → advisory only (recorded, not gating)
checks:
  render: fail
  title: fail
  headings: fail
  landmarks: fail
  overflow: fail
  token_conformance: fail
  axe: fail
  target_size: warn
  keyboard_focus: warn
  reduced_motion: warn

target_size:
  min_px: 24        # WCAG 2.2 AA 2.5.8 Target Size (Minimum)
  recommend_px: 44  # mobile guidance / WCAG 2.1 AAA

overflow_tolerance_px: 1

axe_path: tools/vendor/axe-core/axe.min.js
axe_sha256: 20c09fe157a8a34a30e241aaa1fcdade657734f08ab379ecfbeb7d45cc46e878

evidence_dir: evidence/runs