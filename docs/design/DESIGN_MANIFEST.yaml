  - {id: BRAND-009, title: "Logo and wordmark design", status: REQUIRED, priority: P1, basis: "[S]", evidence: "gap vs BRAND-001/002", notes: "26.1 option A (approved 2026-10-11): wordmark-only — the canonical mark is the typeset text COM-OS; no symbol, no agent-generated artwork. Spec: docs/design/BRAND_ASSET_SPEC.md. Feeds nav; favicon (BRAND-010) and OG image (PAGE-027) are future derivations, not produced here."}
  - {id: BRAND-010, title: "Favicon, apple-touch, and site icon set", status: REQUIRED, priority: P1, basis: "[S]", evidence: "gap vs BRAND-003", notes: "Derivable from the approved typeset text wordmark (26.1 option A, approved 2026-10-11); no artwork produced. Derivation spec in docs/design/BRAND_ASSET_SPEC.md §7. No *.ico committed today is fine; adding files is additive."}
  - {id: BRAND-011, title: "Iconography system (set, sizes, stroke, usage)", status: REQUIRED, priority: P1, basis: "[S]", evidence: "gap vs BRAND-005", notes: "Vector icon set only; no raster icons."}
  - {id: BRAND-012, title: "Imagery / photography policy", status: REQUIRED, priority: P2, basis: "[K]", evidence: "sops/case-study/SKILL.md (future visuals)", notes: "26.14 (approved 2026-10-08, option B): abstract SVG only — no photography/stock in v1; text-led; mark separate; record provenance+licence (GOV-013); responsive + aspect-ratio (RESP-008); alt-text policy first (A11Y-008, in ACCESSIBILITY_SPEC.md); count against 26.15 budgets; founder approval before any asset is published; media tokens evidenced only. Must state: no stock-photo fabrication, no client material without approval (AGENTS.md client isolation)."}
  - {id: BRAND-013, title: "Dark theme", status: REQUIRED, priority: P1, basis: "[S]", evidence: "decision §26.4 APPROVED 2026-10-08 (option B — both light and dark)", notes: "First-class theme architecture required (26.4): both themes WCAG 2.2 AA, no light-only component literals, prefers-color-scheme + explicit override, visual regression covers both themes, dark CSS within §26.15 budgets. Token foundation delivered in DESIGN_TOKENS.yaml (themes + value_dark); frontend theme NOT YET IMPLEMENTED. Promoted FUTURE to REQUIRED under approved 26.4 (manifest rule 10)."}
  - {id: BRAND-014, title: "Density modes (comfortable / compact)", status: FUTURE, priority: P3, basis: "[S]", evidence: "deferred", notes: "Only matters once product UI (OPS) exists."}
  - {id: BRAND-015, title: "Motion language (durations, easing, reduced-motion rules)", status: REQUIRED, priority: P1, basis: "[S]", evidence: "decision §26.7 APPROVED 2026-10-08 (minimal, reduced-motion-safe)", notes: "Motion language defined by 26.7: fast 150ms / normal 250ms / slow 400ms, ease cubic-bezier(0.2,0,0,1); motion optional per component, never mandatory decoration; prefers-reduced-motion mandatory (A11Y-007). Tokens delivered (FOUND-016). Promoted FUTURE to REQUIRED under approved 26.7 for consistency with its already-REQUIRED token counterpart (manifest rule 10)."}

