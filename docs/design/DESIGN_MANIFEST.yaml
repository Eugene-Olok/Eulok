# Company OS Design Manifest
#
# Canonical executable design requirement registry derived from:
# evidence/runs/design-system-audit-2026-10-08.md
# Audit source: docs/design-system-audit
# Audit manifest: 290 items (CURRENT 30 / REQUIRED 175 / FUTURE 63 / OUT_OF_SCOPE 22)
# Post-audit classification: BRAND-013 + FOUND-021 promoted FUTURE to REQUIRED under
# approved decision 26.4 (2026-10-08); BRAND-015 promoted under approved 26.7 (2026-10-08).
# Current totals: CURRENT 30 / REQUIRED 178 / FUTURE 60 / OUT_OF_SCOPE 22.
#
# Rules:
# - Preserve stable IDs; IDs are never reused after deletion.
# - Do not promote FUTURE/OUT_OF_SCOPE items without an explicit founder decision.
# - CURRENT requires repository evidence.
# - REQUIRED requires an approved programme basis and acceptance criteria before implementation.
# - Penpot/frontend/visual fields remain NOT YET CREATED/IMPLEMENTED until evidence exists.
# - This file is a contract registry; it is not evidence that an item has been implemented.

defaults:
  owner: founder
  penpot_target: "CREATED 2026-10-10 (id 52a5041f-08a1-80f1-8008-c50e307f3ef4; see PEN-001)"
  frontend_mapping: "NOT YET IMPLEMENTED"
  visual_baseline: "NOT YET CREATED"

items:
