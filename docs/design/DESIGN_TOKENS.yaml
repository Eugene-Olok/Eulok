# ---------------------------------------------------------------------------
# Contrast matrix (WCAG 2.2 AA) — computed deterministically by the validator
# ---------------------------------------------------------------------------
contrast_matrix:
  policy:
    basis: "WCAG 2.2 Level AA (A11Y-001, FOUND-003)"
    thresholds:
      text_normal: 4.5
      text_large: 3.0
      non_text: 3.0
      focus_indicator: 3.0
  enforcement_modes:
    blocking: "Paired tokens must meet min_ratio once their governing decision is APPROVED; failure then = INVALID. While the decision is pending = VALID_PENDING_DECISION (reported with computed ratio)."
    tracked_defect: "A measured open failure (known defect). Always reported loudly as KNOWN_OPEN_DEFECT; never counted as a pass; closes only when its replacement value lands, passes, and its repair decision is approved."
    advisory: "Reported for review; not a WCAG pass/fail claim (e.g. decorative boundaries outside confirmed 1.4.11 scope)."
  pairs:
    - id: text-on-canvas
      fg: primitive.color.text-raw
      bg: primitive.color.canvas-raw
      fg_dark: primitive.color.dark-text-raw
      bg_dark: primitive.color.dark-canvas-raw
      min_ratio: 4.5
      threshold_class: text_normal
      enforcement: blocking
      basis: "1.4.3"
      decision_id: "26.3"
      dark_decision_id: "26.4"

    - id: muted-text-on-canvas
      fg: primitive.color.text-muted-raw
      bg: primitive.color.canvas-raw
      fg_dark: primitive.color.dark-text-muted-raw
      bg_dark: primitive.color.dark-canvas-raw
      min_ratio: 4.5
      threshold_class: text_normal
      enforcement: blocking
      basis: "1.4.3"
      decision_id: "26.3"
      dark_decision_id: "26.4"

    - id: text-on-surface
      fg: primitive.color.text-raw
      bg: primitive.color.surface-raw
      fg_dark: primitive.color.dark-text-raw
      bg_dark: primitive.color.dark-surface-raw
      min_ratio: 4.5
      threshold_class: text_normal
      enforcement: blocking
      basis: "1.4.3"
      decision_id: "26.3"
      dark_decision_id: "26.4"

    - id: badge-border-on-surface
      fg: primitive.color.border-default-raw
      bg: primitive.color.surface-raw
      fg_dark: primitive.color.dark-border-default-raw
      bg_dark: primitive.color.dark-surface-raw
      min_ratio: 3.0
      threshold_class: non_text
      enforcement: tracked_defect
      basis: "1.4.11"
      defect_id: A11Y-004
      repair_decision: "26.3"
      measured_reference: "4.54:1 (#767676 on #ffffff — repaired 2026-10-08, founder option B)"
      notes: "A11Y-004 repair landed: 4.54:1 ≥ 3.0:1 → DEFECT_CLOSED_PENDING_REVIEW. Not fully closed until the rendered result passes visual review. Retired #bbbbbb (1.92:1) preserved as historical evidence in DESIGN_DECISIONS.md §3 26.3. Dark measure 5.38:1."

    - id: strong-border-on-canvas
      fg: primitive.color.border-strong-raw
      bg: primitive.color.canvas-raw
      fg_dark: primitive.color.dark-border-strong-raw
      bg_dark: primitive.color.dark-canvas-raw
      min_ratio: 3.0
      threshold_class: non_text
      enforcement: blocking
      basis: "1.4.11"
      decision_id: "26.3"
      dark_decision_id: "26.4"
      notes: "Strong/emphasis border (step markers) 18.09:1. Distinct role — not the A11Y-004 replacement (that is border.default → #767676). Dark measure 15.22:1."

    - id: subtle-border-on-canvas
      fg: primitive.color.border-subtle-raw
      bg: primitive.color.canvas-raw
      fg_dark: primitive.color.dark-border-subtle-raw
      bg_dark: primitive.color.dark-canvas-raw
      min_ratio: 3.0
      threshold_class: non_text
      enforcement: blocking
      basis: "1.4.11"
      decision_id: "26.3"
      dark_decision_id: "26.4"
      measured_reference: "3.10:1 (#8f8f8f on #fafafa — repaired 2026-10-08, founder option B)"
      notes: "Card/subtle boundary repaired and upgraded advisory→blocking (founder 2026-10-08): 3.10:1 ≥ 3.0:1 on canvas, 3.23:1 on white. Static-content role — must not be substituted for border.default (UI-component boundary). Dark measure 3.60:1."

    - id: focus-ring-on-canvas
      fg: primitive.color.accent
      bg: primitive.color.canvas-raw
      fg_dark: primitive.color.dark-accent-raw
      bg_dark: primitive.color.dark-canvas-raw
      min_ratio: 3.0
      threshold_class: focus_indicator
      enforcement: blocking
      basis: "2.4.11"
      decision_id: "26.3"
      dark_decision_id: "26.4"
      measured_reference: "17.50:1 (#151515 on #fafafa) / 17.12:1 dark (#f2f2f2 on #0f0f0f)"
      notes: "Funded by the 2026-10-09 monochrome hue approval (semantic.color.focus.ring). Ring geometry (width/offset) still lands with FOUND-017 under GOV-004; rendered focus visual review remains outstanding (ratios are not visual approval)."

    - id: inverse-text-on-action-primary
      fg: primitive.color.canvas-raw
      bg: primitive.color.accent
      fg_dark: primitive.color.dark-canvas-raw
      bg_dark: primitive.color.dark-accent-raw
