# Company OS Design Tokens — canonical machine-readable token contract
#
# Authority chain (DESIGN_SYSTEM.md):
#   Founder decision → this file → Penpot variables / frontend CSS custom properties
#
# STATUS: VALIDATED — 126 canonical tokens classified against the decision
# register: 104 VALID_APPROVED (governing decision APPROVED + contrast valid),
# 22 VALID_PENDING_DECISION (pending, blocked, or not yet owned), 0 INVALID
# (validator run 2026-10-09). Individual token approval is NOT package approval:
# the complete design system is not approved while decisions remain pending or
# blocked (26.1, 26.5, 26.9, 26.11). (26.16 was approved 2026-10-10 — §8.5
# contract restated verbatim, Penpot Cloud.) Every value below is either (a)
# measured evidence from business/site/index.html:12, (b) a labelled proposal,
# or (c) a founder-approved value. The validator
# (tools/validate_design_tokens.py) classifies each token as
# VALID_APPROVED / VALID_PENDING_DECISION / INVALID against the decision
# register in docs/design/DESIGN_DECISIONS.md §5. Nothing here renders in
# production until its decision is APPROVED (GOV-004).
#
# Secrets rule: this file must never contain credentials, MCP endpoints,
# provider keys or environment values. It contains design values only.

schema_version: 1
status: VALIDATED_PARTIALLY_APPROVED
canonical: true
created: "2026-10-08"

authority:
  decision_register: docs/design/DESIGN_DECISIONS.md
  reference_doc: docs/design/DESIGN_TOKENS.md
  manifest: docs/design/DESIGN_MANIFEST.yaml
  baseline_evidence: evidence/runs/design-system-audit-2026-10-08.md
  naming_authority: GOV-002
  approval_gate: GOV-004
  penpot_policy: "Penpot variables and frontend CSS are downstream; neither may originate a value absent from this file (PEN-003)."

# ---------------------------------------------------------------------------
# Theme architecture (26.4, approved 2026-10-08 — option B: both light + dark)
# Light is the canonical production theme. Primitives are shared raw values;
# semantic colour roles map differently per theme (value = light, value_dark =
# dark); components inherit by aliasing semantic roles and must never carry a
# component-owned light-only literal. Initial preference comes from
# prefers-color-scheme; the product shell may apply an explicit override.
# Both themes are measured against WCAG 2.2 AA.
# ---------------------------------------------------------------------------
themes:
  supported: [light, dark]
  default: light
  decision_id: "26.4"
  resolution: "Preference resolved at the semantic colour layer: value (light) | value_dark (dark)."
  system_preference: "prefers-color-scheme provides the initial preference; explicit user/product-shell override supported."
  obligations:
    - "Both themes satisfy WCAG 2.2 AA (contrast_matrix dark pairs)."
    - "No component may hard-code a light-only colour (validator enforces semantic routing)."
    - "Visual regression must cover both themes (open obligation until rendered UI exists)."
    - "Dark-mode CSS counts against the approved performance budgets (26.15)."
  hue_family_status: "RESOLVED 2026-10-09: founder separately approved the hue family under 26.3 — Option 1 neutral-derived monochrome (no invented brand hue; interactive roles map to the strong neutral per theme). Light and dark values land together; see the action/focus/inverse/status tokens and contrast_matrix."

# ---------------------------------------------------------------------------
# Naming rules (GOV-002)
# ---------------------------------------------------------------------------
naming:
  structure: "<layer>.<domain>.<role>[.<variant>]"
  layers: [primitive, semantic, component]
  pattern: "^(primitive|semantic|component)\\.(color|space|radius|shadow|motion|focus|z|icon|type|breakpoint|size)\\.[a-z0-9]+(-[a-z0-9]+)*$"
  rules:
    - "Layer prefix is mandatory and matches the section the token is declared in."
    - "Names are identical in this file, the CSS custom-property mapping, and Penpot variable names."
    - "One name never changes meaning; a meaning change is a new name."
    - "Semantic tokens alias primitives or carry a null pending value; they never hold an unexplained literal."
    - "Component tokens alias semantic tokens (pure geometry may alias primitives directly). No component-to-component aliasing."

# ---------------------------------------------------------------------------
# Status model
# ---------------------------------------------------------------------------
status_model:
  classes:
    VALID_APPROVED: "Structure valid AND contrast valid AND decision status = APPROVED"
    VALID_PENDING_DECISION: "Structure valid but at least one governing decision is not APPROVED, or value is null awaiting decision"
    INVALID: "Structural violation, unknown decision reference, alias cycle, bad literal, or an approved decision whose value fails its contrast threshold"
  value_classes:
    current_evidence: "Measured existing site value (audit §5.2). Evidence, not approval."
    proposed: "Model/audit proposal. Not evidence, not approval."
    pending: "Deliberately null — no value exists until a decision resolves it."
  decision_states_seen_in_register: [PENDING, PENDING_ESCALATE, BLOCKED]

