    breadcrumb: true
  Content:
    described_by_audit_tree: true
    required_families: [COMP-CON, COMP-NAV, COMP-TXT, COMP-SPC, COMP-FBK]
    basis: "§17.1 'Content — case studies index, case study detail, engineering standards, security, privacy, accessibility statement'"
    breadcrumb: true
  Form:
    described_by_audit_tree: true
    required_families: [COMP-CON, COMP-NAV, COMP-FRM, COMP-SEL, COMP-ACT, COMP-FBK, COMP-TXT, COMP-SPC]
    basis: "§17.1 'Form — contact / intake'; consumes PATTERN-INTAKE-FORM"
    pattern: PATTERN-INTAKE-FORM
  Utility:
    described_by_audit_tree: true
    required_families: [COMP-CON, COMP-NAV, COMP-TXT, COMP-SPC]
    basis: "§17.1 'Utility — 404, sitemap'"
  Excluded:
    described_by_audit_tree: true
    required_families: []
    basis: "§17.1 '(Excluded) — blog, pricing, careers, portal, … (OUT_OF_SCOPE, §25)'"
    rule: "May not be implemented without an explicit founder decision that changes the manifest status (manifest rules)."

mapping_confidence:
  CONFIRMED:
    rule: "Template explicitly named in the §17.1 tree, or status/out-of-scope pair from §25."
  PROPOSED:
    rule: "Derivation not enumerated in the audit tree — surfaced as a validator warning for founder review; never silently CONFIRMED."

