# Company OS — Page / Template Map
#
# Canonical mapping of the 30 PAGE manifest items to the six §17.1 templates.
# Templates are instances of the shell (COMP-CON-07); pages are instances of
# templates (§17.1).
#
# Status model: VALIDATED_PARTIALLY_APPROVED — the §17.3 IA structure
# encoded here is approved under decision 26.10 (nav, page hierarchy,
# templates, footer links, utility pages). PAGE-027's template mapping is
# CONFIRMED under Utility by founder decision (GOV-004, 2026-10-09); its
# og:image content stays BLOCKED on the approved mark (26.1/26.5). Full
# Gate 2 package sign-off remains pending; agents never set APPROVED.

schema_version: 1
status: VALIDATED_PARTIALLY_APPROVED
ia_approval:
  decision: "26.10"
  status: APPROVED
  approved_date: "2026-10-08"
  scope: "Full §17.3 IA (nav, page hierarchy, templates, footer links, utility pages) — structure only"
  constraints: "Dependencies stay BLOCKED; IA approval does not imply implementation or launch readiness; test_site_content.py extended not weakened; 26.13 blog/CMS kept separate"
source:
  audit: evidence/runs/design-system-audit-2026-10-08.md
  section: "§17 Page architecture (17.1 templates, 17.2 page-level rules, 17.3 IA)"
  manifest: docs/design/DESIGN_MANIFEST.yaml

shell: COMP-CON-07

