name: phase8-gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy business/site to Cloudflare Pages after the gate passes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Phase 8 Deterministic Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # External credentials (Cloudflare, PostHog) are intentionally
      # absent in untrusted contexts: the gate records BLOCKED in its
      # evidence instead of pretending the deployment passed. The core
      # checks still gate the build.
      PHASE8_ALLOW_BLOCKED: "1"

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pinned.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pinned Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv "$RUNNER_TEMP/company-os-venv"
          "$RUNNER_TEMP/company-os-venv/bin/pip" install \
            --disable-pip-version-check \
            -r requirements-pinned.txt
          printf 'PYTHON_BIN=%s\n' "$RUNNER_TEMP/company-os-venv/bin/python" >> "$GITHUB_ENV"

      - name: Run Phase 8 gate
        shell: bash
        run: ./scripts/gates-phase8.sh

      - name: Upload Phase 8 gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-evidence-phase8
          path: artifacts/gate-evidence-phase8.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy Site (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    # Deploy is only ever attempted from an explicit founder-triggered
    # dispatch. Push/PR runs skip it; a dispatch without secrets fails
    # closed with BLOCKED rather than silently succeeding.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Deploy site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: ./scripts/deploy-site.sh

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-site-evidence
          path: artifacts/deploy-site-evidence.json
          if-no-files-found: warn
          retention-days: 14
